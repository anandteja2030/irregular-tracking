# Docker Compose for the Irregular Object Tracking FastAPI service.
# Paths match config/config.py: PROJECT_ROOT/data (SQLite logs) and
# PROJECT_ROOT/output (CSV/frame artifacts), both inside WORKDIR /app.
services:
  api:
    build: .
    image: irregular-tracking:latest
    container_name: irregular-tracking-api
    # Container listens on ${PORT:-8000} (see Dockerfile ENV/CMD).
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
    volumes:
      # Persistent storage for SQLite logs + exported artifacts. Named
      # volumes inherit /app/data and /app/output ownership from the image.
      - app-data:/app/data
      - app-output:/app/output
    restart: unless-stopped
    # Health check is inherited from the Dockerfile: GET /health -> 200.

volumes:
  app-data:
  app-output: